<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chứng thực online</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height:100%;
            margin: 0;
            overflow: hidden;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .guide-page {
            position: relative;
            width: 100vw;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            padding: 0 24px 24px;
            background: #ffffff;
            min-height: 0;
        }

        .guide-image {
            width: 100%;
            height: auto;
            max-height: calc(100vh - 230px);
            object-fit: contain;
            display: block;
        }

        .btn-navigate {
            position: static;
            transform: none;
            z-index: 10;
            border: 0;
            border-radius: 8px;
            min-width: 260px;
            padding: 24px 48px;
            background: #0f4ea3;
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(15, 78, 163, 0.28);
            flex-shrink: 0;
        }

        .btn-navigate:focus-visible {
            outline: 4px solid rgba(220, 38, 38, 0.35);
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <h1 class="title" style="text-align: center; color: #08b9e6; font-size: 48px;" >📋 Các bước chứng thực online</h1>
    <h2 style="text-align: center; color: #08b9e6; font-size: 32px;">Vui lòng cắm thẻ căn cước trước khi thực hiện các bước ở trong hình.
    </h2>
    <main class="guide-page">
        <img class="guide-image" src="1.png" alt="Huong dan cong dan su dung kiosk chung thuc">
            <button class="btn-navigate" id="btnNavigate" type="button" onclick="navigateToScan()" >Tiếp tục</button>
    </main>

    <script>
        function navigateToScan() {
            window.location.href = 'index2.html';
        }

        window.addEventListener('load', () => {
            document.getElementById('btnNavigate').focus();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') navigateToScan();
        });
    </script>
</body>

</html>
